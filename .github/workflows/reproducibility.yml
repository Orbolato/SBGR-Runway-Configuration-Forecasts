name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned Python environment
        run: python -m pip install -r requirements-ci.txt
      - name: Compile maintained Python source
        run: python -m compileall -q code tests
      - name: Run integrity tests
        run: python -m pytest -q tests
      - name: Regenerate tables and macros from archived results
        run: python code/run_analysis.py --artifacts-only
      - name: Regenerate figures from archived results
        run: python code/make_figures.py
      - name: Verify regenerated artifacts
        run: python code/verify_outputs.py
