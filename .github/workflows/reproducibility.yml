name: Reproducibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Verify archived artifact integrity and source-data exclusion
        run: python tests/check_repository_integrity.py

      - name: Install pinned Python environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m py_compile code/*.py tests/*.py

      - name: Regenerate public artifacts
        run: bash reproduce.sh

      - name: Compare regenerated artifacts with archived results
        run: python code/verify_outputs.py
